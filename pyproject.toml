[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autorl-strategy-manager"
version = "0.1.0"
description = "Scaffold for the AutoRL Strategy Manager diploma project"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Proprietary" }
authors = [
  { name = "AutoRL Project Team" }
]
dependencies = [
  "fastapi>=0.115,<1",
  "matplotlib>=3.9,<4",
  "PyYAML>=6,<7",
  "river>=0.21,<1",
  "streamlit>=1.44,<2",
  "uvicorn>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<6",
]

[project.scripts]
autorl = "autorl.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["src/autorl"]

[tool.coverage.report]
skip_covered = false
show_missing = true
