schema_version: "1.0"
experiment_name: "gradual-drift-selector"
seed: 62
mode: "adaptive"
scenario:
  name: "gradual_drift"
  episodes: 160
  steps_per_episode: 60
  drift_start_episode: 50
  drift_end_episode: 110
  tags: ["drift", "gradual"]
  description: "Reward regime shifts gradually over a wide interval."
strategies:
  - name: "tempered_reward"
    parameters:
      temperature: 0.7
      decay: 0.98
    compute_cost: 0.10
  - name: "adaptive_meta"
    parameters:
      temperature: 0.9
      evaluation_window: 24
    compute_cost: 0.22
meta_controller:
  window_size: 24
  min_samples: 12
  delta: 0.04
  lambda: 1.1
  switch_cost: 0.18
  utility_weights:
    reward_mean: 1.0
    reward_variance: 0.2
    compute_cost: 0.15
    switch_cost: 0.50
artifacts_root: "artifacts"
tags: ["phase1", "gradual_drift"]
