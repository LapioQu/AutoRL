schema_version: "1.0"
experiment_name: "abrupt-drift-selector"
seed: 52
mode: "adaptive"
scenario:
  name: "abrupt_drift"
  episodes: 150
  steps_per_episode: 60
  drift_episode: 75
  tags: ["drift", "abrupt"]
  description: "Reward regime changes sharply at one episode boundary."
strategies:
  - name: "greedy_reward"
    parameters:
      epsilon: 0.05
    compute_cost: 0.08
  - name: "drift_aware"
    parameters:
      detector_window: 15
      trigger_zscore: 2.5
    compute_cost: 0.18
meta_controller:
  window_size: 18
  min_samples: 12
  delta: 0.06
  lambda: 1.2
  switch_cost: 0.20
  utility_weights:
    reward_mean: 1.0
    reward_variance: 0.25
    compute_cost: 0.15
    switch_cost: 0.60
artifacts_root: "artifacts"
tags: ["phase1", "abrupt_drift"]
