schema_version: "1.0"
experiment_name: "fallback-safety-check"
seed: 82
mode: "adaptive"
scenario:
  name: "fallback"
  episodes: 100
  steps_per_episode: 40
  fallback_patience: 5
  tags: ["fallback", "safety"]
  description: "Scenario reserved for insufficient-data and safe-stay pathways."
strategies:
  - name: "fixed"
    parameters:
      exploration_rate: 0.05
    compute_cost: 0.05
  - name: "drift_aware"
    parameters:
      detector_window: 12
    compute_cost: 0.15
meta_controller:
  window_size: 16
  min_samples: 8
  delta: 0.03
  lambda: 1.0
  switch_cost: 0.10
  utility_weights:
    reward_mean: 1.0
    reward_variance: 0.2
    compute_cost: 0.10
    switch_cost: 0.50
artifacts_root: "artifacts"
tags: ["phase1", "fallback"]
